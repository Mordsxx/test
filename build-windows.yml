name: Build Mords Studio (Windows)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name MordsStudio main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MordsStudio-Windows
          path: dist/
