
name: Build Mords Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check project structure
        run: |
          dir
          dir gui
          dir core
          dir engines

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name MordsStudio --paths . --collect-submodules gui --collect-submodules core --collect-submodules engines main.py

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MordsStudio-Windows
          path: dist/MordsStudio.exe
